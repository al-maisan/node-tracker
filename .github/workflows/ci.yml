name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Daily, so a new advisory against the pinned toolchain fails CI before
  # release day.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The toolchain releases are built with (scripts/release.sh), so
          # govulncheck checks their stdlib (go.mod only states the minimum).
          go-version-file: .go-version
      - run: make lint
      - run: make test
      - run: make test-ppa test-copr
      - run: make vuln
      - run: make build && ./bin/node-tracker version
      # A tag-like version, as brew-formula.sh needs one.
      - run: make dist VERSION=v0.0.0
      - run: cd dist && sha256sum -c SHA256SUMS && tar -xzf node-tracker_*_linux_amd64.tar.gz && ./node-tracker_*_linux_amd64/node-tracker version
      - run: scripts/brew-formula.sh v0.0.0 && ruby -c dist/node-tracker.rb
